# What a user can change. chamber_cooled_temp is the one setting; override it in
# examples/cooldown-local.cfg. The timing values are what the engine is built on: the
# profile limits and the progress lines count in ticks of loop_seconds, so change them
# only with a reason.
[gcode_macro _COOLDOWN_SETTINGS]
# Chamber and bed must reach this (°C) for the cooldown to complete
variable_chamber_cooled_temp: 35
# How far below the shown target a reading still counts as level in the report (°C)
variable_arrow_band: 2
# Extra time added to the idle timeout estimate for a hold, ramp and rest (s)
variable_idle_margin_seconds: 600
# Seconds between ticks of the loop
variable_loop_seconds: 5
# Minutes between the HOLD, RAMP, REST and CHILL progress lines
variable_report_minutes: 2
# Seconds between the temperature lines
variable_status_seconds: 25
# Seconds without a tick before COOLDOWN_STATUS says the loop has stopped
variable_stall_seconds: 60
gcode:

# Runtime state, written by the engine. Never write it by hand.
[gcode_macro _COOLDOWN_VARS]
# Selection and progress
variable_cooldown_profile: "PASSIVE_ONLY"
variable_phase: 0
variable_phase_loops: 0
variable_idle_timeout_extended: 0
# The timeout the cooldown set while extended, and the last one set by hand (0 = none
# known). The second is only filled in by idle_timeout_tracking.cfg.
variable_extended_idle_timeout: 0.0
variable_user_idle_timeout: 0.0
# Printer time of the last loop tick, so COOLDOWN_STATUS can tell a stopped loop
variable_last_tick: 0.0

# Values recorded by _COOLDOWN_SNAPSHOT for manual-override detection
variable_seen_chamber_target: 0.0
variable_seen_bed_target: 0.0
variable_seen_exhaust_speed: 0.0
variable_seen_bed_fans_speed: 0.0

# Active profile, converted to loops of loop_seconds by START_COOLDOWN
variable_hold_loops: 0
variable_cooldown_ramp_step_c: 0.0
variable_cooldown_ramp_step_seconds: 0
variable_ramp_step_loops: 0
variable_ramp_chamber_target_temp: 0.0
variable_passive_loops: 0
variable_exhaust_fan_speed: 0.0
variable_external_pc_speed: 0.0
variable_bed_fans_speed: 0.0
gcode:

[gcode_macro START_COOLDOWN]
description: Start cooldown using the selected or given PROFILE
gcode:
  # Values first (nothing is sent), then one flat list of refusals in a fixed order,
  # then the actions.
  {% macro printable(text) -%}
    {text|replace('"', "'")|replace('\x3b', '?')|replace('\x23', '?')|replace('*', '?')}
  {%- endmacro %}

  {% set hardware_installed = 'gcode_macro _HARDWARE_VARS' in printer %}
  {% set hw = printer["gcode_macro _HARDWARE_VARS"] if hardware_installed else {} %}
  {% set cv = printer["gcode_macro _COOLDOWN_VARS"] %}
  {% set cfg = printer["gcode_macro _COOLDOWN_SETTINGS"] %}
  # At least 1, so the values below can be worked out before an invalid setting is refused.
  {% set loop_seconds = [cfg.loop_seconds|int, 1]|max %}
  {% set settings = printer.configfile.settings %}
  {% set table = printer["gcode_macro _COOLDOWN_PROFILES"].profiles %}
  {% set chamber_heater_object = 'heater_generic ' ~ hw.chamber_heater %}
  {% set has_heater = hw.chamber_heater and chamber_heater_object in printer %}
  {% set has_clock = 'toolhead' in printer and printer.toolhead.estimated_print_time is defined %}

  # The loop divides by these, so a value that is not a number, or too small, would raise on
  # the first tick and leave the heater on with nothing to turn it off. Refuse it here.
  {% set not_numeric = [] %}
  {% for key in ['arrow_band', 'idle_margin_seconds', 'loop_seconds', 'report_minutes',
                 'status_seconds', 'stall_seconds'] if cfg[key] is not number %}
    {% set _ = not_numeric.append(key) %}
  {% endfor %}
  {% set setting_errors = [] if not_numeric else [
      'loop_seconds must be a whole number of 1 or more'
          if cfg.loop_seconds < 1 or cfg.loop_seconds != cfg.loop_seconds|int else '',
      'arrow_band and idle_margin_seconds must be 0 or more'
          if cfg.arrow_band < 0 or cfg.idle_margin_seconds < 0 else '',
      'status_seconds, stall_seconds and report_minutes times 60 must each be at least loop_seconds'
          if [cfg.status_seconds, cfg.stall_seconds, cfg.report_minutes * 60]|min < cfg.loop_seconds
          else ''
    ]|select|list %}
  {% if not_numeric %}
    {% set setting_errors = [not_numeric|join(', ') ~ ' must be numbers'] %}
  {% endif %}

  {% set requested = params.PROFILE|default(cv.cooldown_profile)|string %}
  {% set cooldown_profile = requested if requested in table else requested|upper %}
  {% set shown = printable(requested) %}
  {% set known = printable(table|list|sort|join(', ')) %}
  {% set shown_profile = printable(cooldown_profile) %}
  {% set forbidden = ["'", '"', '\x3b', '\x23', '*'] %}

  {% set profile = table[cooldown_profile] if cooldown_profile in table else {} %}
  {% set not_numbers = [] %}
  {% for key in ['chamber_hold_minutes', 'passive_rest_minutes', 'chamber_target_temp',
                 'cooldown_ramp_step_c', 'cooldown_ramp_step_seconds', 'exhaust_fan_speed']
         if profile[key] is not number %}
    {% set _ = not_numbers.append(key) %}
  {% endfor %}
  {% set hold_minutes = profile.chamber_hold_minutes|default(0)|float(0) %}
  {% set rest_minutes = profile.passive_rest_minutes|default(0)|float(0) %}
  {% set ramp_target = profile.chamber_target_temp|default(0)|float(0) %}
  {% set step_c = profile.cooldown_ramp_step_c|default(0)|float(0) %}
  {% set step_seconds = profile.cooldown_ramp_step_seconds|default(0)|int %}
  {% set profile_speed = profile.exhaust_fan_speed|default(0)|float(0) %}
  {% set exhaust_enable = profile.exhaust_enable|default(True) %}
  {% set errors = [
      not_numbers|join(', ') ~ ' must be numbers' if not_numbers else '',
      'profile names cannot contain quote marks, semicolons, hash signs or asterisks'
          if forbidden|select('in', cooldown_profile)|list else '',
      'hold and rest minutes must be 0 or more' if hold_minutes < 0 or rest_minutes < 0 else '',
      'chamber_target_temp must be 0 or more' if ramp_target < 0 else '',
      'a ramp target needs cooldown_ramp_step_c above 0 and cooldown_ramp_step_seconds of '
          ~ loop_seconds ~ ' or more'
          if ramp_target > 0 and (step_c <= 0 or step_seconds < loop_seconds) else '',
      'cooldown_ramp_step_c must be 0.1 or more when ramping'
          if ramp_target > 0 and 0 < step_c < 0.1 else '',
      'exhaust_fan_speed must be between 0.0 and 1.0'
          if profile_speed < 0 or profile_speed > 1 else '',
      'exhaust_enable must be True or False' if exhaust_enable not in [True, False] else ''
    ]|select|list %}

  # The loop ticks every loop_seconds, so a ramp step time is rounded to the nearest tick.
  {% set step_seconds_rounded = ((step_seconds + loop_seconds // 2) // loop_seconds)
                                  * loop_seconds if ramp_target > 0 else step_seconds %}

  # A speed above 0 but below a fan's min_power (or off_below) is raised to that
  # minimum for that fan, and the profile speed is reported once.
  {% set wanted = profile_speed if exhaust_enable else 0.0 %}
  {% set fan_speeds = {} %}
  {% set raised = [] %}
  {% for role in ['exhaust_fan', 'external_pc', 'bed_fans'] %}
    {% set section = 'fan_generic ' ~ hw[role] %}
    {% set fan_settings = settings[section] if hw[role] and section in settings else {} %}
    {% set minimum = fan_settings.min_power if fan_settings.min_power is number
                     else (fan_settings.off_below if fan_settings.off_below is number else 0.0) %}
    {% set final = [wanted, minimum]|max if wanted > 0 else 0.0 %}
    {% set _ = fan_speeds.update({role: final}) %}
    {% if final != wanted %}
      {% set _ = raised.append(role ~ ' (' ~ final ~ ')') %}
    {% endif %}
  {% endfor %}

  {% if not hardware_installed %}
    RESPOND PREFIX="❌" MSG="Klipper-Hardware-Controls is not installed. Include its settings, fans and chamber modules first. Cooldown not started."
  {% elif cv.phase|int != 0 %}
    RESPOND PREFIX="⚠️" MSG="A cooldown is already running (phase {cv.phase|int}/5), so nothing was started. Run COOLDOWN_RESET first to start another."
  {% elif cfg.chamber_cooled_temp is not number %}
    RESPOND PREFIX="❌" MSG="chamber_cooled_temp in _COOLDOWN_SETTINGS must be a number. Cooldown not started."
  {% elif setting_errors %}
    RESPOND PREFIX="❌" MSG="Invalid _COOLDOWN_SETTINGS: {setting_errors|join(', ')}. Cooldown not started."
  {% elif cooldown_profile not in table %}
    RESPOND PREFIX="❌" MSG="Unknown cooldown profile: {shown}. Known profiles: {known}. Cooldown not started."
  {% elif not has_heater and hw.chamber_sensor in printer
          and printer[hw.chamber_sensor].temperature is not number %}
    RESPOND PREFIX="❌" MSG="chamber_sensor in _HARDWARE_VARS has no temperature. Cooldown not started."
  {% elif hw.bed_heater in printer and printer[hw.bed_heater].temperature is not number %}
    RESPOND PREFIX="❌" MSG="bed_heater in _HARDWARE_VARS has no temperature. Cooldown not started."
  {% elif errors %}
    RESPOND PREFIX="❌" MSG="Invalid cooldown profile {shown_profile}: {errors|join(', ')}. Cooldown not started."
  {% else %}
    _COOLDOWN_SNAPSHOT
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=cooldown_profile VALUE="'{cooldown_profile}'"
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=cooldown_ramp_step_c VALUE={step_c}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=cooldown_ramp_step_seconds VALUE={step_seconds_rounded}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=exhaust_fan_speed VALUE={fan_speeds.exhaust_fan}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=external_pc_speed VALUE={fan_speeds.external_pc}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=bed_fans_speed VALUE={fan_speeds.bed_fans}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=hold_loops VALUE={((hold_minutes * 60) // loop_seconds)|int}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=passive_loops VALUE={((rest_minutes * 60) // loop_seconds)|int}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=ramp_step_loops VALUE={step_seconds_rounded // loop_seconds}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=ramp_chamber_target_temp VALUE={ramp_target}

    # Keep idle_timeout from switching the heater off during hold and ramp. The timeout
    # in force before the cooldown (the one set by hand when idle_timeout_tracking.cfg
    # saw it, else the configured one) is restored when the heater is released
    # (phase 3) or on reset.
    {% set configured = settings.idle_timeout.timeout|float
                         if 'idle_timeout' in settings else 600.0 %}
    {% set in_force = cv.user_idle_timeout if cv.user_idle_timeout > 0 else configured %}
    {% if has_heater and printer[chamber_heater_object].target >= ramp_target %}
      {% set start_target = printer[chamber_heater_object].target|float %}
      {% set ramp_steps = ((start_target - ramp_target) / step_c)|round(0, 'ceil')
                              if ramp_target > 0 else 0 %}
      {% set needed = hold_minutes * 60 + ramp_steps * step_seconds_rounded
                            + rest_minutes * 60 + cfg.idle_margin_seconds|int %}
      {% if needed > in_force %}
        SET_IDLE_TIMEOUT TIMEOUT={needed|int} COOLDOWN=1
        SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=extended_idle_timeout VALUE={needed|float}
        SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=idle_timeout_extended VALUE=1
      {% endif %}
    {% endif %}

    RESPOND PREFIX="🧊" MSG="Cooldown started with profile: {cooldown_profile}"
    {% if step_seconds_rounded != step_seconds %}
      RESPOND PREFIX="⚠️" MSG="Ramp step of {step_seconds} s runs as {step_seconds_rounded} s because the loop ticks every {loop_seconds} s"
    {% endif %}
    {% if raised %}
      RESPOND PREFIX="⚠️" MSG="exhaust_fan_speed {wanted} is below the fan minimum, so these fans run at their minimum instead: {raised|join(', ')}"
    {% endif %}
    _COOLDOWN_ENTER_PHASE PHASE=1
    {% if has_clock %}
      SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=last_tick VALUE={printer.toolhead.estimated_print_time|float}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_COOLDOWN_LOOP DURATION={loop_seconds}
  {% endif %}

[gcode_macro COOLDOWN_STATUS]
description: Show cooldown state
gcode:
  {% set cv = printer["gcode_macro _COOLDOWN_VARS"] %}
  {% set cfg = printer["gcode_macro _COOLDOWN_SETTINGS"] %}
  {% set has_clock = 'toolhead' in printer and printer.toolhead.estimated_print_time is defined %}
  {% set now = printer.toolhead.estimated_print_time|float if has_clock else 0.0 %}
  {% set names = ['IDLE', 'HOLD', 'RAMP', 'REST', 'EXHAUST', 'CHILL'] %}
  {% set phase = cv.phase|int %}
  RESPOND PREFIX="📊" MSG="Profile: {cv.cooldown_profile} | Phase: {phase} {names[phase] if 0 <= phase < names|length else '?'} | { '%.1f' % (cv.phase_loops * cfg.loop_seconds / 60.0) } min in phase ({cv.phase_loops} loops)"
  # The loop ticks every loop_seconds. A long silence means it stopped (UPDATE_DELAYED_GCODE
  # DURATION=0 by hand) or the printer was busy with a long command.
  {% if phase != 0 and cv.last_tick > 0 and now - cv.last_tick > cfg.stall_seconds|int %}
    RESPOND PREFIX="⚠️" MSG="The cooldown loop last ran { '%.0f' % (now - cv.last_tick) } s ago. If the printer was not busy, it has stopped. Run COOLDOWN_RESET to clear it."
  {% endif %}

# Stops automation and clears the selection. Heaters and fans are left as they are:
# PRINT_START and UI preheats call this after setting their own targets.
[gcode_macro COOLDOWN_RESET]
description: Stop cooldown automation and clear the selected profile
gcode:
  {% if printer["gcode_macro _COOLDOWN_VARS"].phase|int != 0 and not params.QUIET|default(0)|int %}
    RESPOND PREFIX="🛑" MSG="Cooldown reset"
  {% endif %}
  _COOLDOWN_RESTORE_IDLE_TIMEOUT
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=cooldown_profile VALUE="'PASSIVE_ONLY'"
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=phase VALUE=0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=phase_loops VALUE=0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=seen_chamber_target VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=seen_bed_target VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=seen_exhaust_speed VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=seen_bed_fans_speed VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=last_tick VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=hold_loops VALUE=0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=cooldown_ramp_step_c VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=cooldown_ramp_step_seconds VALUE=0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=ramp_step_loops VALUE=0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=ramp_chamber_target_temp VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=passive_loops VALUE=0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=exhaust_fan_speed VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=external_pc_speed VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=bed_fans_speed VALUE=0.0
  UPDATE_DELAYED_GCODE ID=_COOLDOWN_LOOP DURATION=0

# Records the current chamber target, fan speeds and bed target. The loop treats any
# later difference as a manual override, so call this (after M400) whenever the
# cooldown itself changes one of them.
[gcode_macro _COOLDOWN_SNAPSHOT]
gcode:
  {% set hw = printer["gcode_macro _HARDWARE_VARS"] %}
  {% set chamber_heater_object = 'heater_generic ' ~ hw.chamber_heater %}
  {% set bed_heater_object = hw.bed_heater %}
  {% set bed_fans_object = 'fan_generic ' ~ hw.bed_fans %}
  {% set exhaust_fan_object = 'fan_generic ' ~ hw.exhaust_fan %}
  {% if hw.chamber_heater and chamber_heater_object in printer %}
    {% set chamber_target = printer[chamber_heater_object].target|float %}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=seen_chamber_target VALUE={chamber_target}
  {% elif hw.chamber_sensor in printer %}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=seen_chamber_target VALUE=0.0
  {% endif %}
  {% if exhaust_fan_object in printer %}
    {% set exhaust_fan_speed = printer[exhaust_fan_object].speed|float %}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=seen_exhaust_speed VALUE={exhaust_fan_speed}
  {% endif %}
  {% if bed_fans_object in printer %}
    {% set bed_fans_speed = printer[bed_fans_object].speed|float %}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=seen_bed_fans_speed VALUE={bed_fans_speed}
  {% endif %}
  {% if bed_heater_object in printer %}
    {% set bed_target = printer[bed_heater_object].target|float %}
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=seen_bed_target VALUE={bed_target}
  {% endif %}

# Every phase change goes through here: it resets the phase loop counter, performs
# the phase's entry actions and prints its banner exactly once.
[gcode_macro _COOLDOWN_ENTER_PHASE]
gcode:
  {% set hw = printer["gcode_macro _HARDWARE_VARS"] %}
  {% set cv = printer["gcode_macro _COOLDOWN_VARS"] %}
  {% set cfg = printer["gcode_macro _COOLDOWN_SETTINGS"] %}
  {% set minutes_per_loop = cfg.loop_seconds|int / 60.0 %}
  {% set previous_phase = cv.phase %}
  {% set phase = params.PHASE|int %}
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=phase VALUE={phase}
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=phase_loops VALUE=0
  # A phase the profile does not use still gets its banner, marked skipped, so
  # every cooldown counts through all five phases.
  {% if phase == 1 and cv.hold_loops > 0 %}
    RESPOND PREFIX="♨️" MSG="Cooldown phase 1/5 HOLD: keeping the chamber target for { '%.1f' % (cv.hold_loops * minutes_per_loop) } min"
  {% elif phase == 1 %}
    RESPOND PREFIX="♨️" MSG="Cooldown phase 1/5 HOLD: skipped, profile has no hold"
  {% elif phase == 2 and cv.ramp_chamber_target_temp > 0 %}
    RESPOND PREFIX="🧗" MSG="Cooldown phase 2/5 RAMP: lowering the chamber target {cv.cooldown_ramp_step_c}°C every {cv.cooldown_ramp_step_seconds} s to {cv.ramp_chamber_target_temp}°C"
  {% elif phase == 2 %}
    RESPOND PREFIX="🧗" MSG="Cooldown phase 2/5 RAMP: skipped, profile has no ramp"
  {% elif phase == 3 %}
    {% if previous_phase == 1 %}
      RESPOND PREFIX="🧗" MSG="Cooldown phase 2/5 RAMP: skipped, no hold or ramp to run"
    {% endif %}
    # Heater off on every path into the passive phases, including skipped hold/ramp.
    CHAMBER TEMP=0
    # The bed target is only a hold-up for the cooldown, so release it here and let
    # the bed cool with the chamber.
    {% if hw.bed_heater in printer and printer[hw.bed_heater].target > 0 %}
      RESPOND PREFIX="🛏️" MSG="Bed heater turned off (its target was { '%.0f' % printer[hw.bed_heater].target }°C), the bed now cools with the chamber"
      SET_HEATER_TEMPERATURE HEATER={hw.bed_heater.split(' ')[-1]} TARGET=0
    {% endif %}
    {% if cv.passive_loops > 0 %}
      EXHAUST_FAN SPEED=0
      EXTERNAL_PC SPEED=0
      BED_FANS SPEED=0
    {% endif %}
    _COOLDOWN_RESTORE_IDLE_TIMEOUT
    {% if cv.passive_loops > 0 %}
      RESPOND PREFIX="⏳" MSG="Cooldown phase 3/5 REST: chamber heater off, resting { '%.1f' % (cv.passive_loops * minutes_per_loop) } min"
    {% else %}
      RESPOND PREFIX="⏳" MSG="Cooldown phase 3/5 REST: chamber heater off, rest skipped, profile has no rest"
    {% endif %}
  {% elif phase == 4 %}
    # Name the speeds the fans will actually get: a fan minimum can raise one fan
    # above the profile speed, so the three need not match.
    {% set planned = {
        'exhaust_fan': cv.exhaust_fan_speed,
        'external_pc': cv.external_pc_speed,
        'bed_fans': cv.bed_fans_speed} %}
    {% set per_fan = [] %}
    {% set speeds = [] %}
    {% for role, fan_speed in planned.items()
           if hw[role] and ('fan_generic ' ~ hw[role]) in printer %}
      {% set _ = per_fan.append(role ~ ' to ' ~ fan_speed) %}
      {% if fan_speed not in speeds %}
        {% set _ = speeds.append(fan_speed) %}
      {% endif %}
    {% endfor %}
    {% if speeds|length > 1 %}
      RESPOND PREFIX="💨" MSG="Cooldown phase 4/5 EXHAUST: {per_fan|join(', ')}"
    {% else %}
      RESPOND PREFIX="💨" MSG="Cooldown phase 4/5 EXHAUST: fans to {speeds[0] if speeds else cv.exhaust_fan_speed}"
    {% endif %}
  {% elif phase == 5 %}
    RESPOND PREFIX="🐌" MSG="Cooldown phase 5/5 CHILL: waiting for chamber and bed at or below {cfg.chamber_cooled_temp}°C"
  {% endif %}

[gcode_macro _COOLDOWN_RESTORE_IDLE_TIMEOUT]
gcode:
  {% set cv = printer["gcode_macro _COOLDOWN_VARS"] %}
  {% if cv.idle_timeout_extended|int %}
    {% set settings = printer.configfile.settings %}
    {% set configured = settings.idle_timeout.timeout|float
                         if 'idle_timeout' in settings else 600.0 %}
    {% set restored = cv.user_idle_timeout if cv.user_idle_timeout > 0 else configured %}
    SET_IDLE_TIMEOUT TIMEOUT={restored} COOLDOWN=1
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=idle_timeout_extended VALUE=0
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=extended_idle_timeout VALUE=0.0
  {% endif %}

# Periodic progress for the readings the loop passes in. Arrows compare readings
# to the displayed target (above / within 2°C below / further below); they are
# not trends.
[gcode_macro _COOLDOWN_REPORT]
gcode:
  {% set cv = printer["gcode_macro _COOLDOWN_VARS"] %}
  {% set cfg = printer["gcode_macro _COOLDOWN_SETTINGS"] %}
  {% set phase = cv.phase|int %}
  {% set loops = cv.phase_loops|int %}
  {% set minutes_per_loop = cfg.loop_seconds|int / 60.0 %}
  {% set elapsed_min = loops * minutes_per_loop %}
  {% set chamber_temp = params.CHAMBER_TEMP|float %}
  {% set chamber_target = params.CHAMBER_TARGET|float %}
  {% set bed_temp = params.BED_TEMP|float %}
  {% set bed_target = params.BED_TARGET|float %}

  {% set chamber_shown = [chamber_target, cfg.chamber_cooled_temp]|max %}
  {% set chamber_arrow = "→" %}
  {% if chamber_temp > chamber_shown %}
    {% set chamber_arrow = "↑" %}
  {% elif chamber_temp < chamber_shown - cfg.arrow_band %}
    {% set chamber_arrow = "↓" %}
  {% endif %}
  {% set bed_shown = [bed_target, cfg.chamber_cooled_temp]|max %}
  {% set bed_arrow = "→" %}
  {% if bed_temp > bed_shown %}
    {% set bed_arrow = "↑" %}
  {% elif bed_temp < bed_shown - cfg.arrow_band %}
    {% set bed_arrow = "↓" %}
  {% endif %}

  {% if loops > 0 and loops % (cfg.report_minutes * 60 // cfg.loop_seconds|int) == 0 %}
    {% if phase == 1 %}
      RESPOND PREFIX="♨️" MSG="Cooldown HOLD: { '%.1f' % elapsed_min } of { '%.1f' % (cv.hold_loops * minutes_per_loop) } min"
    {% elif phase == 2 %}
      RESPOND PREFIX="🧗" MSG="Cooldown RAMP: chamber target { '%.1f' % chamber_target }°C, heading for {cv.ramp_chamber_target_temp}°C"
    {% elif phase == 3 %}
      RESPOND PREFIX="⏳" MSG="Cooldown REST: { '%.1f' % elapsed_min } of { '%.1f' % (cv.passive_loops * minutes_per_loop) } min"
    {% elif phase == 5 %}
      RESPOND PREFIX="🐌" MSG="Cooldown CHILL: waiting for {cfg.chamber_cooled_temp}°C"
    {% endif %}
  {% endif %}
  {% if loops % (cfg.status_seconds // cfg.loop_seconds|int) == 0 %}
    RESPOND PREFIX="📃" MSG="Chamber {chamber_arrow} { '%05.1f' % chamber_temp }/{ '%05.1f' % chamber_shown }  •  Bed {bed_arrow} { '%05.1f' % bed_temp }/{ '%05.1f' % bed_shown }  •  Cycle { '%03d' % loops }"
  {% endif %}

# Turns the chamber and bed heaters off. A cooldown that ends or stops with no way to
# know the temperatures must not leave them heating.
[gcode_macro _COOLDOWN_HEATERS_OFF]
gcode:
  {% set hw = printer["gcode_macro _HARDWARE_VARS"] %}
  CHAMBER TEMP=0
  {% if hw.bed_heater in printer and printer[hw.bed_heater].target > 0 %}
    SET_HEATER_TEMPERATURE HEATER={hw.bed_heater.split(' ')[-1]} TARGET=0
  {% endif %}

# Each tick does exactly one of: stop (override, new print, complete), one phase
# transition, or advance the phase loop counter.
[delayed_gcode _COOLDOWN_LOOP]
gcode:
  {% set hw = printer["gcode_macro _HARDWARE_VARS"] %}
  {% set chamber_heater_object = 'heater_generic ' ~ hw.chamber_heater %}
  {% set has_heater = hw.chamber_heater and chamber_heater_object in printer %}
  {% set bed_heater_object = hw.bed_heater %}
  {% set bed_fans_object = 'fan_generic ' ~ hw.bed_fans %}
  {% set exhaust_fan_object = 'fan_generic ' ~ hw.exhaust_fan %}
  {% set external_pc_object = 'fan_generic ' ~ hw.external_pc %}
  {% set has_clock = 'toolhead' in printer and printer.toolhead.estimated_print_time is defined %}
  {% set cv = printer["gcode_macro _COOLDOWN_VARS"] %}
  {% set cfg = printer["gcode_macro _COOLDOWN_SETTINGS"] %}
  {% set phase = cv.phase|int %}
  {% set loops = cv.phase_loops|int %}

  {% if has_heater %}
    {% set chamber_temp = printer[chamber_heater_object].temperature %}
    {% set chamber_target = printer[chamber_heater_object].target %}
  {% elif hw.chamber_sensor in printer %}
    {% set chamber_temp = printer[hw.chamber_sensor].temperature %}
    {% set chamber_target = 0.0 %}
  {% else %}
    {% set chamber_temp = 0.0 %}
    {% set chamber_target = 0.0 %}
  {% endif %}
  {% set bed_temp = printer[bed_heater_object].temperature
                    if bed_heater_object in printer else 0.0 %}
  {% set bed_target = printer[bed_heater_object].target if bed_heater_object in printer else 0.0 %}
  {% set bed_fans_speed = printer[bed_fans_object].speed if bed_fans_object in printer else 0.0 %}
  {% set exhaust_fan_speed = printer[exhaust_fan_object].speed
                                if exhaust_fan_object in printer else 0.0 %}

  # What this cooldown last set or saw, against what is there now.
  {% set changed = [] %}
  {% for label, seen, current in [
      ('chamber target', cv.seen_chamber_target, chamber_target),
      ('bed target', cv.seen_bed_target, bed_target),
      ('exhaust fan speed', cv.seen_exhaust_speed, exhaust_fan_speed),
      ('bed fans speed', cv.seen_bed_fans_speed, bed_fans_speed)] if seen != current %}
    {% set _ = changed.append(label) %}
  {% endfor %}

  {% set numbers = [
      cfg.chamber_cooled_temp, cv.hold_loops, cv.passive_loops, cv.ramp_step_loops,
      cv.ramp_chamber_target_temp, cv.cooldown_ramp_step_c, cv.cooldown_ramp_step_seconds,
      cv.exhaust_fan_speed, cv.external_pc_speed, cv.bed_fans_speed] %}

  {% if cv.phase == 0 %}
    # Reset while this tick was pending; stay stopped.

  {% elif phase < 1 or phase > 5 or numbers|reject('number')|list %}
    RESPOND PREFIX="⚠️" MSG="Cooldown stopped: a value in _COOLDOWN_VARS is not valid. The heaters are off."
    _COOLDOWN_HEATERS_OFF
    COOLDOWN_RESET QUIET=1

  {% elif chamber_temp is not number or bed_temp is not number %}
    RESPOND PREFIX="⚠️" MSG="Cooldown stopped: the chamber or bed temperature cannot be read. The heaters are off."
    _COOLDOWN_HEATERS_OFF
    COOLDOWN_RESET QUIET=1

  {% elif changed %}
    RESPOND PREFIX="⚠️" MSG="Cooldown stopped: chamber, bed or fan settings were changed by hand ({changed|join(', ')}). The rest of the cooldown is cancelled and the heaters and fans stay as you set them."
    COOLDOWN_RESET QUIET=1

  {% elif 'print_stats' in printer and printer.print_stats.state == "printing" %}
    RESPOND PREFIX="⚠️" MSG="Cooldown stopped: the printer started printing"
    COOLDOWN_RESET QUIET=1

  {% elif chamber_temp <= cfg.chamber_cooled_temp and bed_temp <= cfg.chamber_cooled_temp %}
    RESPOND PREFIX="❄️" MSG="Cooldown complete"
    RESPOND PREFIX="❄️" MSG="Chamber { '%05.1f' % chamber_temp }/{ '%05.1f' % ([chamber_target, cfg.chamber_cooled_temp]|max) }  •  Bed { '%05.1f' % bed_temp }/{ '%05.1f' % ([bed_target, cfg.chamber_cooled_temp]|max) }  •  Cycle { '%03d' % loops }"
    _COOLDOWN_HEATERS_OFF
    RESET_FANS
    COOLDOWN_RESET QUIET=1

  {% else %}
    # The branches below overlap (for example the first two can both be true), so
    # their order decides which one runs. Keep it.
    _COOLDOWN_REPORT CHAMBER_TEMP={chamber_temp} CHAMBER_TARGET={chamber_target} BED_TEMP={bed_temp} BED_TARGET={bed_target}

    {% if phase in [1, 2] and not has_heater %}
      RESPOND PREFIX="📃" MSG="No chamber heater, skipping hold and ramp"
      _COOLDOWN_ENTER_PHASE PHASE=3

    {% elif phase == 1 and loops == 0 and cv.seen_chamber_target < cv.ramp_chamber_target_temp %}
      RESPOND PREFIX="📃" MSG="Chamber target {cv.seen_chamber_target}°C is below the ramp target {cv.ramp_chamber_target_temp}°C, skipping hold and ramp"
      _COOLDOWN_ENTER_PHASE PHASE=3

    {% elif phase == 1 and loops >= cv.hold_loops %}
      {% if cv.hold_loops > 0 %}
        RESPOND PREFIX="🤝" MSG="Hold complete"
      {% endif %}
      _COOLDOWN_ENTER_PHASE PHASE=2

    {% elif phase == 2 and cv.ramp_chamber_target_temp <= 0 %}
      _COOLDOWN_ENTER_PHASE PHASE=3

    {% elif phase == 2 and chamber_target <= cv.ramp_chamber_target_temp %}
      RESPOND PREFIX="🏁" MSG="Ramp target reached"
      _COOLDOWN_ENTER_PHASE PHASE=3

    {% elif phase == 3 and loops >= cv.passive_loops %}
      {% if cv.passive_loops > 0 %}
        RESPOND PREFIX="⏰" MSG="Rest complete"
      {% endif %}
      _COOLDOWN_ENTER_PHASE PHASE=4

    {% elif phase == 4 %}
      {% if exhaust_fan_object not in printer and external_pc_object not in printer
            and bed_fans_object not in printer %}
        RESPOND PREFIX="⚠️" MSG="No exhaust, external_pc or bed_fans fan configured, skipping exhaust"
      {% else %}
        EXHAUST_FAN SPEED={cv.exhaust_fan_speed}
        EXTERNAL_PC SPEED={cv.external_pc_speed}
        BED_FANS SPEED={cv.bed_fans_speed}
      {% endif %}
      _COOLDOWN_ENTER_PHASE PHASE=5

    {% else %}
      {% if phase == 2 and cv.ramp_step_loops > 0 and loops % cv.ramp_step_loops == 0 %}
        # Step down without overshooting the ramp target.
        CHAMBER TEMP={[chamber_target - cv.cooldown_ramp_step_c, cv.ramp_chamber_target_temp]|max}
      {% endif %}
      SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=phase_loops VALUE={loops + 1}
    {% endif %}

    # Record this tick's own changes so the next tick does not see them as an override.
    M400
    _COOLDOWN_SNAPSHOT
    {% if has_clock %}
      SET_GCODE_VARIABLE MACRO=_COOLDOWN_VARS VARIABLE=last_tick VALUE={printer.toolhead.estimated_print_time|float}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_COOLDOWN_LOOP DURATION={cfg.loop_seconds|int}
  {% endif %}
